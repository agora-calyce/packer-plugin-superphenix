# Exemple : build d'une image et export qcow2 en artefact GitLab.
# Variables CI à définir (Settings > CI/CD > Variables) :
#   PKR_VAR_token (masquée) · PKR_VAR_api_url · PKR_VAR_org_id · PKR_VAR_az · PKR_VAR_project_id
#   PKR_VAR_subnet_eid · PKR_VAR_eip_eid · PKR_VAR_runner_cidr (IP sortante du runner, /32)
stages: [build]

build-image:
  stage: build
  image:
    name: hashicorp/packer:latest
    entrypoint: [""]
  variables:
    PACKER_PLUGIN_PATH: .packer.d/plugins
  cache:
    key: packer-plugins
    paths: [.packer.d/plugins]
  script:
    - mkdir -p output
    - packer init example/ubuntu.pkr.hcl
    - packer validate example/ubuntu.pkr.hcl
    - packer build -color=false example/ubuntu.pkr.hcl
  artifacts:
    paths: [output/ubuntu.qcow2]
    expire_in: 1 week
  timeout: 1h
  resource_group: superphenix-packer # un seul build à la fois : une seule EIP/SG pour le helper
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
