# Example: build an image and export it as a qcow2 GitLab artifact.
# The runner must reach the private IPs of the Superphenix subnet (runner hosted in the subnet, or VPN):
# the builder (SSH, or WinRM for Windows) and the export (SSH) connect to the VMs' private IP.
# CI variables to define (Settings > CI/CD > Variables):
#   PKR_VAR_token (masked) · PKR_VAR_api_url · PKR_VAR_org_id · PKR_VAR_az · PKR_VAR_project_id
#   PKR_VAR_subnet_eid
# If the plugin repository is private, `packer init` also needs PACKER_GITHUB_API_TOKEN (masked).
stages: [build]

build-image:
  stage: build
  image:
    name: hashicorp/packer:1.11
    entrypoint: [""]
  variables:
    PACKER_PLUGIN_PATH: .packer.d/plugins
  cache:
    key: packer-plugins
    paths: [.packer.d/plugins]
  script:
    - mkdir -p output
    - packer init example/ubuntu.pkr.hcl
    - packer validate example/ubuntu.pkr.hcl
    - packer build -color=false example/ubuntu.pkr.hcl
  artifacts:
    paths: [output/ubuntu.qcow2]
    expire_in: 1 week
  timeout: 1h
  resource_group: superphenix-packer # one build at a time
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
