# Continuous integration, INACTIVE while it stays in release/ (see release/README.md).
# To enable it: move it to .github/workflows/ci.yml.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go install github.com/hashicorp/packer-plugin-sdk/cmd/packer-sdc@latest
      - name: Format
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: make test
      - run: make plugin-check
      # Generated files and .web-docs/ must be up to date.
      - name: Generated files are up to date
        run: |
          make generate
          git diff --exit-code
