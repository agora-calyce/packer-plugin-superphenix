# Intégration continue, INACTIVE tant qu'elle reste dans release/ (voir release/README.md).
# Pour l'activer : la déplacer vers .github/workflows/ci.yml.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go install github.com/hashicorp/packer-plugin-sdk/cmd/packer-sdc@latest
      - name: Format
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: make test
      - run: make plugin-check
      # Les fichiers générés et .web-docs/ doivent être à jour.
      - name: Generated files are up to date
        run: |
          make generate
          git diff --exit-code
